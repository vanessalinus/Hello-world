{% extends "base.html" %}
{% block content %}
<h1 class="mb-3">Create Shipment</h1>

<form class="card p-3" method="post">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Customer Name</label>
      <input class="form-control" name="customer_name" required />
    </div>
    <div class="col-md-6">
      <label class="form-label">Weight (kg)</label>
      <input class="form-control" type="number" step="0.01" min="0.01" name="weight_kg" required />
    </div>
    <div class="col-md-6">
      <label class="form-label">Origin</label>
      <input class="form-control" name="origin" required />
    </div>
    <div class="col-md-6">
      <label class="form-label">Destination</label>
      <input class="form-control" name="destination" required />
    </div>
    <div class="col-md-4">
      <label class="form-label">Priority</label>
      <select class="form-select" name="priority">
        {% for priority in priorities %}
        <option value="{{ priority }}">{{ priority }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Status</label>
      <select class="form-select" name="status">
        {% for status in statuses %}
        <option value="{{ status }}">{{ status }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">ETA</label>
      <input class="form-control" type="datetime-local" name="eta" required />
    </div>
    <div class="col-md-6">
      <label class="form-label">Driver</label>
      <select class="form-select" name="driver_id">
        <option value="">Unassigned</option>
        {% for driver in drivers %}
        <option value="{{ driver.id }}">{{ driver.name }} ({{ driver.license_number }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Vehicle</label>
      <select class="form-select" name="vehicle_id">
        <option value="">Unassigned</option>
        {% for vehicle in vehicles %}
        <option value="{{ vehicle.id }}">
          {{ vehicle.plate_number }} - {{ vehicle.vehicle_type }} ({{ vehicle.status }})
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="col-12">
      <label class="form-label">Notes</label>
      <textarea class="form-control" rows="3" name="notes"></textarea>
    </div>
  </div>
  <div class="mt-4">
    <button class="btn btn-primary" type="submit">Create Shipment</button>
  </div>
</form>
{% endblock %}
