{% extends "base.html" %}
{% block content %}
<h1 class="mb-3">Drivers</h1>

<div class="row g-4">
  <div class="col-lg-4">
    <div class="card p-3">
      <h5>Add Driver</h5>
      <form method="post">
        <div class="mb-2">
          <label class="form-label">Name</label>
          <input class="form-control" name="name" required />
        </div>
        <div class="mb-2">
          <label class="form-label">License Number</label>
          <input class="form-control" name="license_number" required />
        </div>
        <div class="mb-2">
          <label class="form-label">Phone</label>
          <input class="form-control" name="phone" required />
        </div>
        <button class="btn btn-primary w-100 mt-2" type="submit">Add Driver</button>
      </form>
    </div>
  </div>

  <div class="col-lg-8">
    <div class="card">
      <div class="table-responsive">
        <table class="table table-striped mb-0">
          <thead>
            <tr>
              <th>Name</th>
              <th>License</th>
              <th>Phone</th>
              <th>Active</th>
            </tr>
          </thead>
          <tbody>
            {% for driver in drivers %}
            <tr>
              <td>{{ driver.name }}</td>
              <td>{{ driver.license_number }}</td>
              <td>{{ driver.phone }}</td>
              <td>{{ "Yes" if driver.is_active else "No" }}</td>
            </tr>
            {% else %}
            <tr>
              <td colspan="4" class="text-center py-4">No drivers available.</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
