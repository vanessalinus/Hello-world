<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title or "Logistics Management" }}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('logistics.dashboard') }}">LogisticsPro</a>
        <div class="navbar-nav">
          <a class="nav-link" href="{{ url_for('logistics.dashboard') }}">Dashboard</a>
          <a class="nav-link" href="{{ url_for('logistics.list_shipments') }}">Shipments</a>
          <a class="nav-link" href="{{ url_for('logistics.create_shipment') }}">New Shipment</a>
          <a class="nav-link" href="{{ url_for('logistics.drivers') }}">Drivers</a>
          <a class="nav-link" href="{{ url_for('logistics.vehicles') }}">Vehicles</a>
        </div>
      </div>
    </nav>

    <main class="container pb-5">
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="mb-3">
        {% for category, message in messages %}
        <div
          class="alert {% if category == 'error' %}alert-danger{% else %}alert-success{% endif %} mb-2"
        >
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
